name: OCT News 24 RSS Auto News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/import-rss-news.mjs"
      - ".github/workflows/rss-auto-news.yml"

permissions:
  contents: read

concurrency:
  group: oct-news-rss-import
  cancel-in-progress: false

jobs:
  import-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Import RSS headlines and summaries
        run: npm run import-news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
